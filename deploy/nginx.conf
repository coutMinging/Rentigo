# ============================================================
# 厂房及公寓楼出租管理系统 · nginx 反向代理
#
# 放置位置：/etc/nginx/conf.d/farental.conf
# 生效命令：nginx -t && systemctl reload nginx
#
# 说明：前端页面与 API 全部由后端 Node 进程（127.0.0.1:3001）提供，
#       所以这里只做「转发 + 补真实客户端 IP」两件事，不需要配 root 静态目录。
#       前端是 history 路由，SPA 的刷新兜底由 Node 负责，nginx 不用管。
#
# 没有域名、直接用 IP 访问时，下面的配置不用改就能用。
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # 有域名后改成你的域名，例如 rental.example.com
    # 保持 _ 表示匹配所有 Host，适合先用 IP 验证
    server_name _;

    # 上传接口单文件上限 10MB，这里留一点余量
    client_max_body_size 12m;

    # 导出 Excel、批量生成账单可能偏慢，给足超时
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # 后端在生产模式开启了 trust proxy，靠这几个头拿到真实 IP 写进操作日志
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ============================================================
